# Railway deployment config for the marketing/public site (Astro, static
# output — see astro.config.mjs's header comment for why Astro).
#
# This repo is a monorepo (frontend + backend + marketing as three separate
# Railway services from the same GitHub repo). When creating THIS service
# in Railway's dashboard, set its "Root Directory" to `marketing` — that's
# what tells Railway to use this file (and this folder's package.json)
# rather than the other two services'.
#
# Same reasoning as frontend/railway.toml: `astro preview` is documented by
# Astro itself as a local-preview-only tool, not meant for production
# traffic, so — exactly like the frontend service — the build output
# (plain static HTML/CSS/JS in dist/) is served by plain `serve` instead.
#
# Deliberately WITHOUT the `-s`/`--single` flag. `-s` is single-page-app
# mode: it treats every extensionless path as a client-side route and
# unconditionally serves index.html for it, without even checking whether
# a real file exists there first. This site is the opposite of an SPA —
# every page (about, terms, security, learn, ...) is its own real .html
# file on disk from Astro's static build — so `-s` was actively wrong
# here, not just an unused option: it silently served the homepage for
# EVERY real page's URL, including a direct address-bar visit to e.g.
# /terms, because `-s` doesn't check the filesystem before rewriting. A
# previous version of this file had `-s` on, reasoning it was a harmless
# SEO-safe fallback for stray unmatched paths — that reasoning missed
# that `-s` rewrites unconditionally rather than only-when-not-found, so
# it was breaking every real route rather than just handling 404s. Without
# it, `serve`'s default (always-on) clean-URL resolution still correctly
# maps `/terms` to `dist/terms/index.html`; a genuinely nonexistent path
# now gets a real 404 instead of a silently-wrong 200.
[build]
buildCommand = "npm run build"

[deploy]
# Runs the "start" script from package.json: `serve -s dist -l $PORT`.
# $PORT is assigned by Railway at runtime — never hardcode a port here.
startCommand = "npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
