<?xml version="1.0" encoding="UTF-8"?>
<!--
  Decorative hero graphic: a classical marble bust wearing sunglasses,
  raising the Quantex "psi" mark overhead like a trident/weapon — a nod to
  the crypto-twitter "Greek/Roman statue" meme aesthetic the user asked
  for. Hand-authored flat-vector artwork (not a photo) specifically so it
  carries zero copyright risk unlike compositing our logo onto a real
  statue photograph — see the chat discussion on why real Bybit-style
  photography elsewhere on this site comes from freely-licensed stock
  (Unsplash) rather than screenshots of a competitor's own site.

  The trident prongs re-use the EXACT path data from frontend/public/
  favicon.svg (just scaled/rotated via the <g transform> below) so the
  "weapon" reads unmistakably as the Quantex mark rather than a generic
  shape. To retint anything here, edit the fill/stroke hex values directly
  below — they're deliberately hardcoded to this file's own palette
  (copied from tokens.css) rather than referencing CSS custom properties,
  since this file is used as a plain <img src="/statue-hero.svg"> and a
  standalone SVG file loaded that way can't see the page's CSS variables.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 520">
  <defs>
    <linearGradient id="marble" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6F1E6" />
      <stop offset="1" stop-color="#DFD3B8" />
    </linearGradient>
  </defs>

  <!-- Soft circular badge backdrop -->
  <circle cx="190" cy="260" r="220" fill="#DCE8E3" opacity="0.55" />

  <!-- Ground shadow -->
  <ellipse cx="190" cy="472" rx="120" ry="14" fill="#2A2620" opacity="0.08" />

  <!-- Pedestal -->
  <rect x="100" y="430" width="180" height="14" rx="4" fill="#EEE6D3" />
  <rect x="110" y="444" width="160" height="26" rx="6" fill="#E0D5BE" />

  <!-- Raised arm + sleeve (drawn before torso so the shoulder seam sits naturally underneath) -->
  <path
    d="M245,255 C262,222 278,188 288,150 C292,132 296,118 300,106 L322,112
       C314,132 306,152 298,178 C286,214 268,240 252,266 Z"
    fill="url(#marble)"
  />

  <!-- Torso / draped shoulders -->
  <path
    d="M70,430 L70,362 C70,300 102,250 152,236 L210,236
       C258,250 290,300 290,362 L290,430 Z"
    fill="url(#marble)"
  />
  <!-- Diagonal toga sash for a classical silhouette -->
  <path d="M118,248 L100,300 L166,430 L198,430 Z" fill="#E0D5BE" opacity="0.65" />

  <!-- Neck -->
  <rect x="162" y="196" width="36" height="42" rx="8" fill="url(#marble)" />

  <!-- Head -->
  <circle cx="180" cy="150" r="62" fill="url(#marble)" />

  <!-- Hair cap -->
  <path
    d="M118,140 C118,84 148,58 180,58 C212,58 242,84 242,140
       C242,110 216,96 180,96 C144,96 118,110 118,140 Z"
    fill="#E4D9C2"
  />

  <!-- Laurel wreath -->
  <g fill="#0E6B62">
    <ellipse cx="132" cy="108" rx="15" ry="6" transform="rotate(-45 132 108)" />
    <ellipse cx="147" cy="88" rx="15" ry="6" transform="rotate(-22 147 88)" />
    <ellipse cx="166" cy="76" rx="15" ry="6" transform="rotate(-6 166 76)" />
    <ellipse cx="194" cy="76" rx="15" ry="6" transform="rotate(6 194 76)" />
    <ellipse cx="213" cy="88" rx="15" ry="6" transform="rotate(22 213 88)" />
    <ellipse cx="228" cy="108" rx="15" ry="6" transform="rotate(45 228 108)" />
    <ellipse cx="180" cy="70" rx="15" ry="6" />
  </g>

  <!-- Sunglasses (flat aviator style) -->
  <g fill="#20241F">
    <rect x="122" y="138" width="50" height="30" rx="11" />
    <rect x="190" y="138" width="50" height="30" rx="11" />
    <rect x="172" y="147" width="18" height="8" rx="3" />
  </g>
  <line x1="122" y1="150" x2="100" y2="144" stroke="#20241F" stroke-width="8" stroke-linecap="round" />
  <line x1="240" y1="150" x2="262" y2="144" stroke="#20241F" stroke-width="8" stroke-linecap="round" />
  <!-- Lens glints -->
  <circle cx="138" cy="148" r="4" fill="#8FAFA4" opacity="0.85" />
  <circle cx="206" cy="148" r="4" fill="#8FAFA4" opacity="0.85" />

  <!-- Mouth -->
  <path d="M164,192 Q180,199 196,192" stroke="#6B6357" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Fist gripping the haft -->
  <circle cx="306" cy="102" r="17" fill="url(#marble)" />

  <!-- The Quantex mark, held aloft like a trident — path data identical to
       frontend/public/favicon.svg, just transformed. -->
  <g transform="translate(306,118) rotate(-18) scale(1.55) translate(-36,-36)"
     stroke="#0E6B62" stroke-width="8" fill="none" stroke-linecap="square">
    <path d="M18 10 V32 Q18 44 36 44 Q54 44 54 32 V10" />
    <line x1="36" y1="10" x2="36" y2="62" />
  </g>
</svg>
